<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#131823"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8963e"/>
    </marker>
  </defs>
  <rect width="1280" height="300" rx="18" fill="#0d1017"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <!-- cards: x positions 30, 280, 530, 780, 1030 ; width 220 -->
    <g>
      <rect x="30" y="54" width="220" height="192" rx="14" fill="url(#card)" stroke="#2c3446"/>
      <g transform="translate(140,88)" fill="none" stroke="#e9c46a" stroke-width="2.5"><path d="M-26,0 Q0,-22 26,0 Q0,22 -26,0 Z"/><circle r="8" fill="#e9c46a"/></g>
      <text x="140" y="150" text-anchor="middle" font-size="19" fill="#f3eee4" font-weight="600">Read</text>
      <text x="140" y="182" text-anchor="middle" font-size="15" fill="#a9b1c3">story · mood · subject</text>
      <text x="140" y="206" text-anchor="middle" font-size="15" fill="#a9b1c3">light · colour · space</text>
    </g>
    <g>
      <rect x="280" y="54" width="220" height="192" rx="14" fill="url(#card)" stroke="#2c3446"/>
      <g transform="translate(390,88)" fill="none" stroke="#e9c46a" stroke-width="2.5"><rect x="-24" y="-8" width="48" height="26" rx="3"/><path d="M-24,-8 L-20,-22 L26,-14 L24,-8"/><path d="M-10,-19 L-14,-9 M4,-17 L0,-8 M18,-15 L14,-8"/></g>
      <text x="390" y="150" text-anchor="middle" font-size="19" fill="#f3eee4" font-weight="600">Director's brief</text>
      <text x="390" y="182" text-anchor="middle" font-size="15" fill="#a9b1c3">a six-line plan</text>
      <text x="390" y="206" text-anchor="middle" font-size="15" fill="#a9b1c3">directs AI and tools</text>
    </g>
    <g>
      <rect x="530" y="54" width="220" height="192" rx="14" fill="url(#card)" stroke="#c8963e" stroke-width="1.5"/>
      <g transform="translate(640,88)" fill="#e9c46a"><path d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z"/><circle cx="22" cy="-18" r="3.5"/><circle cx="-20" cy="18" r="2.5"/></g>
      <text x="640" y="150" text-anchor="middle" font-size="19" fill="#e9c46a" font-weight="600">Light &amp; colour</text>
      <text x="640" y="182" text-anchor="middle" font-size="15" fill="#a9b1c3">AI lends the light</text>
      <text x="640" y="206" text-anchor="middle" font-size="15" fill="#a9b1c3">every pixel stays yours</text>
    </g>
    <g>
      <rect x="780" y="54" width="220" height="192" rx="14" fill="url(#card)" stroke="#2c3446"/>
      <g transform="translate(890,88)" fill="none" stroke="#e9c46a" stroke-width="2.5"><path d="M0,-22 L0,20 M-14,20 L14,20 M-22,-14 L22,-14"/><path d="M-22,-14 L-30,4 L-14,4 Z M22,-14 L14,4 L30,4 Z"/></g>
      <text x="890" y="150" text-anchor="middle" font-size="19" fill="#f3eee4" font-weight="600">Refine &amp; check</text>
      <text x="890" y="182" text-anchor="middle" font-size="15" fill="#a9b1c3">no invented light</text>
      <text x="890" y="206" text-anchor="middle" font-size="15" fill="#a9b1c3">strength just right</text>
    </g>
    <g>
      <rect x="1030" y="54" width="220" height="192" rx="14" fill="#1d2f63" stroke="#3a5ba8"/>
      <g transform="translate(1140,88)" fill="none" stroke="#c9d3ea" stroke-width="2.5"><rect x="-26" y="-20" width="52" height="40" rx="3"/><path d="M-20,14 L-6,-2 L4,8 L12,0 L20,14" /><circle cx="12" cy="-9" r="4" fill="#e9c46a" stroke="none"/></g>
      <text x="1140" y="150" text-anchor="middle" font-size="19" fill="#f3eee4" font-weight="600">One photo</text>
      <text x="1140" y="182" text-anchor="middle" font-size="15" fill="#c9d3ea">story | style</text>
      <text x="1140" y="206" text-anchor="middle" font-size="15" fill="#c9d3ea">straight to Photos</text>
    </g>
    <g stroke="#c8963e" stroke-width="2.5" marker-end="url(#arr)">
      <line x1="252" y1="150" x2="276" y2="150"/>
      <line x1="502" y1="150" x2="526" y2="150"/>
      <line x1="752" y1="150" x2="776" y2="150"/>
      <line x1="1002" y1="150" x2="1026" y2="150"/>
    </g>
    <text x="640" y="280" text-anchor="middle" font-size="14" fill="#6f7a90">Not good enough? It retries a safer step on its own — down to a pure-tool edit — and always hands you one photo, without asking.</text>
  </g>
</svg>
