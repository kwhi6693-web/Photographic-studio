    <rect x="60" y="550" width="1160" height="50" rx="14" fill="url(#card)" stroke="#2c3446" stroke-width="1"/><text x="640.0" y="581.0" text-anchor="middle" font-size="15" fill="#a9b1c3">LICENSE: MIT · photos © the author</text>
