    <rect x="60" y="304" width="1160" height="92" rx="14" fill="url(#card)" stroke="#c8963e" stroke-width="1.5"/><text x="640.0" y="344.0" text-anchor="middle" font-size="18" font-weight="600" fill="#e9c46a">optional/  shared deterministic tools</text><text x="640.0" y="369.0" text-anchor="middle" font-size="14" fill="#a9b1c3">light transfer · route ladder · strength trim · full resolution · checks</text>
