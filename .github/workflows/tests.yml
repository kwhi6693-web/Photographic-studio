name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:   # a new push to the same branch or PR cancels the run still going (each run takes ~15 min)
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -q -rx
